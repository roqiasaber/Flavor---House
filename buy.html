<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Now</title>
    <link rel="stylesheet" href="buy.css">
</head>
<body>

    <div class="buy-container">

        <h1>Order Food</h1>

        <p>Complete your order by filling in the details below.</p>

        <form>

            <input type="text" placeholder="Full Name" required>

            <input type="email" placeholder="Email Address" required>

            <input type="tel" placeholder="Phone Number" required>

            <input type="text" placeholder="Delivery Address" required>

            <select required>
                <option value="">Choose Your Meal</option>
                <option>Classic Burger - $8.99</option>
                <option>Pasta Alfredo - $7.99</option>
                <option>Margherita Pizza - $9.99</option>
            </select>

            <input type="number" placeholder="Quantity" min="1" required>

            <button type="submit">Place Order</button>

        </form>

        <br>

        <a href="index.html">← Back to Home</a>

    </div>

</body>
</html>
